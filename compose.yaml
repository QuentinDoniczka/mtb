# Stack de développement et de recette pour MTB (Berger Hollandais du Mont Brabant).
#
# Ne dicte jamais l'architecture du thème ou de l'extension (voir docker-mtb dans CLAUDE.md) :
# rien ici ne doit devenir une dépendance de production. La cible de production reste un
# hébergement mutualisé PHP standard (BRIEF §12).
#
# Démarrage : `make up` (voir docs/docker.md pour le détail des commandes).

name: mtb

services:
  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  wordpress:
    build:
      context: .
      dockerfile: docker/wordpress/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE}
      WORDPRESS_DB_USER: ${MYSQL_USER}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD}
      WORDPRESS_TABLE_PREFIX: wp_
      WORDPRESS_DEBUG: ${WORDPRESS_DEBUG:-1}
    volumes:
      - wp_data:/var/www/html
      # Thème et extension montés depuis l'arbre de travail — jamais copiés dans l'image.
      - ./wp-content/themes/mtb:/var/www/html/wp-content/themes/mtb
      - ./wp-content/plugins/mtb-core:/var/www/html/wp-content/plugins/mtb-core
    ports:
      - "${WP_PORT:-8080}:80"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/ -o /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 40s

  wpcli:
    build:
      context: .
      dockerfile: docker/wpcli/Dockerfile
    restart: unless-stopped
    # Doit écrire dans le même volume que "wordpress" (cœur, wp-content/uploads, wp-content/languages).
    # L'image wp-cli (Alpine) a www-data en uid 82 ; l'image wordpress (Debian) l'a en uid 33.
    # On force donc le même uid que le conteneur wordpress pour éviter les erreurs de permission.
    user: "33:33"
    depends_on:
      db:
        condition: service_healthy
      wordpress:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE}
      WORDPRESS_DB_USER: ${MYSQL_USER}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD}
      WP_SITE_URL: ${WP_SITE_URL:-http://localhost:8080}
      WP_SITE_TITLE: ${WP_SITE_TITLE}
      WP_ADMIN_USER: ${WP_ADMIN_USER}
      WP_ADMIN_PASSWORD: ${WP_ADMIN_PASSWORD}
      WP_ADMIN_EMAIL: ${WP_ADMIN_EMAIL}
      WP_EDITOR_USER: ${WP_EDITOR_USER}
      WP_EDITOR_PASSWORD: ${WP_EDITOR_PASSWORD}
      WP_EDITOR_EMAIL: ${WP_EDITOR_EMAIL}
    volumes:
      - wp_data:/var/www/html
      - ./wp-content/themes/mtb:/var/www/html/wp-content/themes/mtb
      - ./wp-content/plugins/mtb-core:/var/www/html/wp-content/plugins/mtb-core
      - ./docker/provision:/provision:ro
      - ./docker/fixtures:/fixtures:ro
    entrypoint: ["/bin/sh", "/provision/provision.sh"]
    healthcheck:
      test: ["CMD-SHELL", "wp --path=/var/www/html core is-installed"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s

  mail:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8025/api/v1/info || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

volumes:
  db_data:
  wp_data:
