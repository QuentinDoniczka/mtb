# Stack de développement et de recette pour MTB (Berger Hollandais du Mont Brabant).
#
# Ne dicte jamais l'architecture du thème ou de l'extension (voir docker-mtb dans CLAUDE.md) :
# rien ici ne doit devenir une dépendance de production. La cible de production reste un
# hébergement mutualisé PHP standard (BRIEF §12).
#
# Démarrage : `make up` (voir docs/docker.md pour le détail des commandes).

name: mtb

services:
  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  wordpress:
    build:
      context: .
      dockerfile: docker/wordpress/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE}
      WORDPRESS_DB_USER: ${MYSQL_USER}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD}
      WORDPRESS_TABLE_PREFIX: wp_
      WORDPRESS_DEBUG: ${WORDPRESS_DEBUG:-1}
      # Destination des diagnostics PHP (#31). WORDPRESS_DEBUG pilote déjà WP_DEBUG, mais le
      # wp-config.php généré par l'image officielle ne définit NI WP_DEBUG_LOG NI
      # WP_DEBUG_DISPLAY : le cœur retombe alors sur ses valeurs par défaut (journal désactivé,
      # affichage activé), et wp_debug_mode() fait "ini_set('display_errors', 1)" — donc une
      # notice s'imprimait dans le HTML du visiteur pendant que "wp-content/debug.log" n'existait
      # même pas. Les deux constantes manquantes sont posées ici.
      #
      # WP_DEBUG_DISPLAY est câblé à "false" sans interrupteur : un hébergement mutualisé ne
      # montre jamais une notice au visiteur, et une notice imprimée dans la page fausserait à
      # elle seule le poids de page, la validité du balisage et la passe d'accessibilité.
      #
      # Pourquoi WORDPRESS_CONFIG_EXTRA plutôt qu'un fichier posé à l'installation : ce bloc est
      # "eval"-ué à CHAQUE requête par wp-config.php, jamais figé à la création du volume. Le
      # réglage prend donc sur une stack déjà installée, sans "make reset", et ne peut pas se
      # désynchroniser.
      #
      # Ne JAMAIS définir WP_DEBUG dans ce bloc : le wp-config.php généré l'a déjà défini, à
      # partir de WORDPRESS_DEBUG, AVANT d'atteindre l'"eval" qui exécute ces lignes. Le
      # redéfinir émettrait un avertissement « constant already defined » — soit fabriquer
      # exactement le bruit que ce réglage sert à capturer.
      #
      # Le service "wpcli" ne reçoit délibérément pas WORDPRESS_DEBUG : la décision 29 de
      # docs/ETAT.md et quatre contrats gelés s'appuient sur « WP_DEBUG est faux en WP-CLI », et
      # provision.sh analyse la sortie de commandes WP-CLI. « Aucune notice » ne se mesure donc
      # que sur une page rendue (voir docs/docker.md).
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_DEBUG_LOG', WP_DEBUG );
        define( 'WP_DEBUG_DISPLAY', false );
    volumes:
      - wp_data:/var/www/html
      # Thème et extension montés depuis l'arbre de travail — jamais copiés dans l'image.
      - ./wp-content/themes/mtb:/var/www/html/wp-content/themes/mtb
      - ./wp-content/plugins/mtb-core:/var/www/html/wp-content/plugins/mtb-core
    ports:
      - "${WP_PORT:-8080}:80"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/ -o /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 40s

  wpcli:
    build:
      context: .
      dockerfile: docker/wpcli/Dockerfile
    restart: unless-stopped
    # Doit écrire dans le même volume que "wordpress" (cœur, wp-content/uploads, wp-content/languages).
    # L'image wp-cli (Alpine) a www-data en uid 82 ; l'image wordpress (Debian) l'a en uid 33.
    # On force donc le même uid que le conteneur wordpress pour éviter les erreurs de permission.
    user: "33:33"
    depends_on:
      db:
        condition: service_healthy
      wordpress:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE}
      WORDPRESS_DB_USER: ${MYSQL_USER}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD}
      WP_SITE_URL: ${WP_SITE_URL:-http://localhost:8080}
      WP_SITE_TITLE: ${WP_SITE_TITLE}
      WP_ADMIN_USER: ${WP_ADMIN_USER}
      WP_ADMIN_PASSWORD: ${WP_ADMIN_PASSWORD}
      WP_ADMIN_EMAIL: ${WP_ADMIN_EMAIL}
      WP_EDITOR_USER: ${WP_EDITOR_USER}
      WP_EDITOR_PASSWORD: ${WP_EDITOR_PASSWORD}
      WP_EDITOR_EMAIL: ${WP_EDITOR_EMAIL}
      # Interrupteur du jeu de démonstration (#29) — nom gelé, communiqué à la chaîne #20 :
      # ne pas renommer. Valeur par défaut 1 (comportement inchangé : "make up" montre un site
      # peuplé). Voir .env.example pour l'explication destinée à l'éleveuse, et provision.sh
      # pour le point où la variable est lue.
      MTB_FIXTURES: ${MTB_FIXTURES:-1}
    volumes:
      - wp_data:/var/www/html
      - ./wp-content/themes/mtb:/var/www/html/wp-content/themes/mtb
      - ./wp-content/plugins/mtb-core:/var/www/html/wp-content/plugins/mtb-core
      - ./docker/provision:/provision:ro
      - ./docker/fixtures:/fixtures:ro
      # Archive du site source (#19), lecture seule absolue — c'est une pièce à conviction, jamais
      # une donnée de travail. Point de montage dicté par
      # includes/migration/portees-chiens/chemins.php::racine_du_source() : à défaut de l'option
      # "--source", cette fonction calcule dirname(__DIR__, 6) depuis son propre dossier, soit six
      # niveaux au-dessus de "portees-chiens" (migration, includes, mtb-core, plugins, wp-content,
      # racine du dépôt). Le module mtb-core n'étant bind-monté que par ses deux sous-dossiers
      # (thème, extension) et non par "wp-content" entier, ce calcul retombe ICI sur
      # "/var/www/html", jamais sur la racine du dépôt hôte : le montage doit donc reproduire
      # "docs/migration/source" à cet endroit précis pour que la commande "wp mtb
      # importer-portees-chiens" (#20) trouve son archive sans le moindre "--source" ni "--photos"
      # (les photos vivent dans son sous-dossier "photos/", couvert par le même montage). Le
      # comparateur hors ligne de #21 (concordance/concordance.py) n'en a besoin sous aucune forme
      # : il tourne délibérément sur l'hôte, jamais dans un conteneur (voir son en-tête).
      - ./docs/migration/source:/var/www/html/docs/migration/source:ro
    # CECI EST UN CONTOURNEMENT, PAS UNE RÉPARATION — la cause n'est pas corrigée ici.
    #
    # "sed | sh" plutôt que "sh /provision/provision.sh" en direct : le dépôt tourne en
    # "core.autocrlf=true" sans ".gitattributes" (fait déjà mesuré côté archive, dette T-#21-m) —
    # un checkout Windows livre donc "provision.sh" en CRLF, et "/bin/sh" y lit "set -u" suivi
    # d'un retour chariot, ce qui échoue immédiatement ("illegal option --").
    #
    # La vraie réparation serait un ".gitattributes" — mais PAS à la racine du dépôt : un
    # ".gitattributes" racine ("* text=auto" ou "*.sh text eol=lf") s'appliquerait aussi à
    # "docs/migration/source/html/*.html", dont la fin de ligne EST la preuve d'archive
    # (T-#21-m) — le "git add --renormalize" qui suivrait détruirait la pièce à conviction pour
    # réparer un script de démarrage. La bonne portée est un ".gitattributes" CIBLÉ, placé dans
    # "docker/.gitattributes" avec un motif du type "*.sh text eol=lf" qui ne couvre que ce
    # sous-arbre — jamais la racine.
    #
    # Non fait maintenant, délibérément : c'est un changement qui modifie des octets versionnés
    # (renormalisation au prochain "git add"/checkout) et mérite sa propre vérification — que
    # rien sous "docs/" ni "wp-content/" ne matche le motif, que le "git add --renormalize" ne
    # touche que les fichiers de "docker/" — plutôt que d'être un effet de bord discret d'un
    # commit dont l'objet déclaré est le montage de l'archive. On ne corrige jamais le fichier sur
    # disque ici (le montage "/provision" est en lecture seule de toute façon) : la normalisation
    # ne vit que dans ce tuyau d'exécution, et ne touche jamais un octet versionné.
    entrypoint: ["/bin/sh", "-c", "sed 's/\\r$//' /provision/provision.sh | /bin/sh"]
    healthcheck:
      test: ["CMD-SHELL", "wp --path=/var/www/html core is-installed"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s

  mail:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8025/api/v1/info || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

volumes:
  db_data:
  wp_data:
