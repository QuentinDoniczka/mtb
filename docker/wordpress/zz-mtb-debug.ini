; Fidélité du journal de diagnostics PHP (#31).
;
; L'image officielle "wordpress" livre /usr/local/etc/php/conf.d/error-logging.ini avec
; "ignore_repeated_errors = On". Ce réglage est raisonnable sur un serveur de production,
; dont on veut protéger le disque ; il est nuisible ici, où la stack n'existe que pour
; produire des vérifications qui prouvent quelque chose. Une notice qui se répète sur vingt
; pages n'y serait journalisée qu'une seule fois, et une chaîne lisant ce journal conclurait
; « une seule occurrence » à partir d'un fichier qui lui ment par omission : exactement le
; défaut que l'issue #31 répare.
;
; "log_errors_max_len = 0" vise la troncature à 1 024 octets que le même fichier de l'image
; demande, mais ne corrige rien aujourd'hui : cette directive a été SUPPRIMÉE de PHP en 8.0 — sur
; PHP 8.1.34, la version de cette stack, "php -i" ne la connaît plus et "ini_get" renvoie false.
; Ni la valeur de l'image ni celle-ci n'ont donc d'effet : aucun message n'est tronqué. Cette
; ligne n'est là que pour rester juste si la stack redescendait un jour sous PHP 8.0.
;
; "ignore_repeated_source = Off" est déjà la valeur de l'image ; elle est répétée ici pour que
; les trois réglages qui gouvernent la fidélité du journal se lisent au même endroit.
;
; Le préfixe "zz-" est ce qui rend la surcharge effective : PHP charge les fichiers de
; conf.d par ordre alphabétique, et "zz-mtb-debug.ini" est lu APRÈS "error-logging.ini",
; donc ses valeurs gagnent. Même motif que "zz-mtb-mail.ini" (docker/mail/mail.ini).
;
; Ce fichier ne touche ni display_errors ni error_log : l'affichage au visiteur est
; interdit par WP_DEBUG_DISPLAY (compose.yaml) et la destination du journal est choisie
; par wp_debug_mode() à l'exécution, qui repointe error_log sur wp-content/debug.log.

ignore_repeated_errors = Off
ignore_repeated_source = Off
log_errors_max_len = 0
