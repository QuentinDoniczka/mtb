; Route wp_mail() / mail() vers msmtp, qui relaie vers le capteur de courrier local (Mailpit).
; Développement uniquement — la configuration de départ de courrier en production dépend de
; l'hébergeur retenu (question ouverte Q5, docs/ETAT.md) et n'est pas décidée ici.
;
; Partagé par les images "wordpress" et "wpcli" : msmtp est installé au même chemin
; (/usr/bin/msmtp) sur Debian (apt) et Alpine (apk).
sendmail_path = "/usr/bin/msmtp -t -i"
